version: '3.8'

services:
  back:
    build: ./backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
    depends_on:
      database:
        condition: service_healthy

  database:
      image: mysql:8.0.36
      #volumes: 
      #  - database:/data/db
      volumes:
      - ./database/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
      ports:
        - 3306:3306
        - 33060:33060
      environment:
        - MYSQL_ROOT_PASSWORD=root
        - MYSQL_DATABASE=TFG
        - MYSQL_USER=user
        - MYSQL_PASSWORD=user
      healthcheck:
        test: ["CMD-SHELL", "mysql --user=user --password=user --database=TFG -e 'SELECT 1'"]
        interval: 10s
        timeout: 5s
        retries: 10
        start_period: 10s
  
  front:
    build: ./frontend
    stdin_open: true
    tty: true
    ports:
      - "8081:8081"
      - "19000:19000"
      - "19001:19001"
      - "19002:19002"
    environment:
      - NODE_ENV=development
    depends_on:
      - back