version: '3.8'

services:
  back:
    build: ./backend
    volumes:
      - ./backend:/app
    ports:
      - "3000:3000" 
    environment:
      - NODE_ENV=development
      - PORT=3000
    command: sh -c "npm install && nodemon --signal SIGTERM index.js"
    depends_on:
      database:
        condition: service_healthy

  database:
      image: mysql:8.0.36
      volumes:
        - database:/var/lib/mysql
        - ./database/01_init_db.sql:/docker-entrypoint-initdb.d/01_init_db.sql
        - ./database/02_fill_language.sql:/docker-entrypoint-initdb.d/02_fill_language.sql
      ports:
        - 3306:3306
        - 33060:33060
      environment:
        - MYSQL_ROOT_PASSWORD=root
        - MYSQL_DATABASE=TFG
        - MYSQL_USER=user
        - MYSQL_PASSWORD=user
      healthcheck:
        test: ["CMD-SHELL", "mysql --user=user --password=user --database=TFG -e 'SELECT 1'"]
        interval: 5s
        timeout: 5s
        retries: 10
        start_period: 3s
  
  # Interfaz web para la base de datos (Adminer), para poder visualizar la base de datos
  adminer:
    image: adminer
    restart: always
    links:
      # Enlaza el servicio de adminer con el servicio de la base de datos
      # está configurado para que se pueda acceder a la base de datos con el nombre "db"
      - database:db
    ports:
      - 8080:8080

  front:
    build: ./frontend
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npx expo start --tunnel"
    stdin_open: true
    tty: true
    ports:
      - "8081:8081"
      - "19000:19000"
      - "19001:19001"
      - "19002:19002"
    environment:
      - NODE_ENV=development
    depends_on:
      - back

volumes:
  database:
